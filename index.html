<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f9f7f3' rx='16'/><text x='50%' y='47%' dominant-baseline='central' text-anchor='middle' font-size='85' font-family='Arial' font-weight='bold' fill='%231b1613'>白</text></svg>">
    <title>Shiro</title>
    <meta name="description" content="A clean, distraction-free text editor for focused writing.">
    <meta name="theme-color">
    <script>
        // Set theme before CSS is applied to avoid screen flashing
        (function () {
            const savedTheme = localStorage.getItem('shiroTheme');
            const theme = savedTheme ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #100b08;
            --text: #e7e4e0;
            --placeholder: #857f7b;
            --transition: 0.3s ease;
            --hover-accent: #d45f46;
            --caret: rgba(from var(--hover-accent) r g b / 0.9);
            color-scheme: dark;
        }

        [data-theme="light"] {
            --bg: #f9f7f3;
            --text: #1b1613;
            --placeholder: #69625d;
            --hover-accent: #bd4d34;
            --caret: var(--hover-accent);
            color-scheme: light;
        }

        body {
            margin: 0;
            font: 18px/1.6 "Menlo", "DejaVu Sans Mono", "Consolas", monospace;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            transition: background var(--transition);
        }

        #editor,
        #editor::placeholder {
            transition: background var(--transition), color var(--transition), opacity var(--transition);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            padding: 18px 20px;
            gap: 20px;
            transition: opacity var(--transition), transform var(--transition);
        }

        .controls>div {
            display: flex;
            gap: 20px;
        }

        @media (hover: hover) and (pointer: fine) {
            .controls#top.hidden {
                opacity: 0;
                transform: translateY(-5px);
            }

            .controls#bottom.hidden {
                opacity: 0;
                transform: translateY(5px);
            }
        }

        /* Keep controls visible on mobile */
        @media (hover: none) and (pointer: coarse) {

            .controls#top.hidden,
            .controls#bottom.hidden {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .controls#top.hidden,
            .controls#bottom.hidden {
                transform: none;
            }
        }

        .btn {
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            cursor: pointer;
            font-size: 15px;
            transition: opacity var(--transition), color var(--transition);
            user-select: none;
            color: rgb(from var(--text) r g b / 0.6);
        }

        .btn:hover,
        .btn:focus-visible {
            color: var(--hover-accent);
        }

        .btn:focus-visible {
            outline: none;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }

        #editor {
            width: 100%;
            height: min(80dvh, 100%);
            padding-inline: clamp(20px, 10vw, 20vh);
            padding-block: 2.5vh;
            font: inherit;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            resize: none;
            tab-size: 4;
            caret-color: var(--caret);
        }

        #editor::placeholder {
            color: var(--placeholder);
        }

        ::selection {
            background-color: rgba(from var(--hover-accent) r g b / 0.5);
            color: inherit;
        }

        .scroll-fade {
            position: absolute;
            inset-inline: clamp(20px, 10vw, 20vh);
            height: 80px;
            pointer-events: none;
            transition: opacity var(--transition), background-color var(--transition);
            z-index: 1;
            background-color: var(--bg);
        }

        .scroll-fade.top {
            top: 0;
            mask-image: linear-gradient(to bottom, black 25%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 25%, transparent 100%);
        }

        .scroll-fade.bottom {
            bottom: 0;
            mask-image: linear-gradient(to top, black 25%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 25%, transparent 100%);
        }

        #print {
            display: none;
        }

        @media print {
            body {
                display: block;
                height: auto;
                overflow: visible;
                background: white;
                color: black;
            }

            .controls,
            main {
                display: none;
            }

            #print {
                display: block;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                tab-size: 4;
            }
        }
    </style>
</head>

<body>
    <div class="controls" id="top">
        <div>
            <button type="button" class="btn" data-action="download">Download</button>
            <button type="button" class="btn" data-action="clear">Clear</button>
        </div>
        <div>
            <button type="button" class="btn" data-action="theme">Light</button>
            <button type="button" class="btn" data-action="fullscreen">Fullscreen</button>
        </div>
    </div>

    <main>
        <div class="scroll-fade top"></div>
        <textarea id="editor" placeholder="Start writing..." aria-label="Writing area"></textarea>
        <div class="scroll-fade bottom"></div>
    </main>

    <div class="controls" id="bottom">
        <div>
            <button type="button" class="btn" data-action="about">About</button>
        </div>
        <div>
            <button type="button" class="btn" id="count" data-action="count">0 words</button>
        </div>
    </div>

    <div id="print"></div>

    <script>
        // LocalStorage keys
        const SHIRO_THEME = 'shiroTheme';
        const SHIRO_COUNT_MODE = 'shiroCountMode';
        const SHIRO_SAVED_TEXT = 'shiroSavedText';
        const SHIRO_CURSOR_POSITION = 'shiroCursorPosition';

        // Text file extensions that can be opened
        const TEXT_FILES = ['.txt', '.md', '.markdown'];

        // List item: indent, marker (-, * or 1.) and content
        const LIST_ITEM = /^(\s*)([-*]|\d+\.)\s+(.*)$/;

        class Shiro {
            constructor() {
                this.editor = document.getElementById('editor');
                this.controls = document.querySelectorAll('.controls');
                this.countDisplay = document.getElementById('count');
                this.fadeTop = document.querySelector('.scroll-fade.top');
                this.fadeBottom = document.querySelector('.scroll-fade.bottom');
                this.themeColor = document.querySelector('meta[name="theme-color"]');
                this.printView = document.getElementById('print');

                this.theme = document.documentElement.dataset.theme;
                this.countMode = localStorage.getItem(SHIRO_COUNT_MODE) || 'words';
                this.segmenter = typeof Intl.Segmenter === "function"
                    ? new Intl.Segmenter(navigator.language, { granularity: "word" })
                    : null;
                this.visible = true;

                this.init();
            }

            init() {
                this.loadText();
                this.setTheme(this.theme, { transition: false });
                this.bindEvents();
                this.updateCount();
                this.editor.focus();
            }

            bindEvents() {
                const isMac = /Mac|iPhone|iPad/.test(navigator.userAgent);

                // Editor events
                this.editor.addEventListener('input', () => {
                    this.saveText();
                    if (this.visible) {
                        this.updateCount();
                    }
                    this.hide();
                    this.updateFade();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Let IME composition finish; Safari reports keyCode 229 on the confirming Enter
                    if (e.isComposing || e.keyCode === 229) return;

                    const modKey = isMac ? e.metaKey : e.ctrlKey;
                    // Fall back to the physical key on non-Latin layouts
                    const key = /^[a-z]$/i.test(e.key) ? e.key.toLowerCase() : e.code.replace('Key', '').toLowerCase();

                    // Smart Enter for lists
                    if (e.key === 'Enter' && e.target === this.editor) {
                        this.handleSmartEnter(e);
                        return;
                    }

                    // Smart Backspace for removing empty list items
                    if (e.key === 'Backspace' && e.target === this.editor) {
                        this.handleSmartBackspace(e);
                        return;
                    }

                    if (e.key === 'Tab' && e.target === this.editor) {
                        this.handleSmartTab(e);
                        return;
                    }

                    // Open file: Ctrl+O (Windows/Linux) or Cmd+O (Mac)
                    if (modKey && key === 'o') {
                        e.preventDefault();
                        this.openFile();
                        return;
                    }

                    // Save text: Ctrl+S (Windows/Linux) or Cmd+S (Mac)
                    if (modKey && key === 's') {
                        e.preventDefault();
                        this.download();
                        return;
                    }

                    // Clear text: Ctrl+K (Windows/Linux) or Cmd+K (Mac)
                    if (modKey && key === 'k') {
                        e.preventDefault();
                        this.clearWithConfirmation();
                        return;
                    }

                    // Theme toggle: Shift+Ctrl+T (Windows/Linux) or Shift+Cmd+T (Mac)
                    if (modKey && e.shiftKey && key === 't') {
                        e.preventDefault();
                        this.toggleTheme();
                        return;
                    }

                    // Fullscreen toggle: Shift+Ctrl+F (Windows/Linux) or Shift+Cmd+F (Mac)
                    if (modKey && e.shiftKey && key === 'f') {
                        e.preventDefault();
                        this.fullscreen();
                        return;
                    }

                    // Focus editor on any other keydown
                    this.editor.focus();
                });

                // Update text area fade on scroll
                this.editor.addEventListener('scroll', () => this.updateFade(), { passive: true });

                window.addEventListener('resize', () => this.updateFade(), { passive: true });

                // Control buttons
                const actions = {
                    download: () => this.download(),
                    clear: () => this.clearWithConfirmation(),
                    fullscreen: () => this.fullscreen(),
                    theme: () => this.toggleTheme(),
                    about: () => this.about(),
                    count: () => this.toggleCountMode()
                };

                document.addEventListener('click', e => {
                    const action = e.target.dataset.action;
                    if (action && actions[action]) {
                        e.preventDefault();
                        actions[action]();
                        this.editor.focus({ preventScroll: true });
                    }
                });

                // Show controls on mouse movement
                document.addEventListener('mousemove', () => this.show(), { passive: true });

                // Follow system theme changes until a theme is picked
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (localStorage.getItem(SHIRO_THEME)) return;
                    this.setTheme(e.matches ? 'dark' : 'light');
                });

                document.addEventListener('dragover', e => {
                    if (e.dataTransfer.types.includes('Files')) e.preventDefault();
                });

                document.addEventListener('drop', e => {
                    const file = e.dataTransfer.files[0];
                    if (!file) return;
                    e.preventDefault();
                    if (TEXT_FILES.some(ext => file.name.toLowerCase().endsWith(ext))) this.loadFile(file);
                });

                window.addEventListener('beforeprint', () => {
                    this.printView.textContent = this.editor.value;
                });

                // Fullscreen change
                document.addEventListener('fullscreenchange', () => {
                    const btn = document.querySelector('[data-action="fullscreen"]');
                    btn.textContent = document.fullscreenElement ? 'Normal' : 'Fullscreen';
                });

                // Save cursor position when it moves
                this.editor.addEventListener('selectionchange', () => {
                    this.saveCursorPosition();
                });
            }

            saveText() {
                localStorage.setItem(SHIRO_SAVED_TEXT, this.editor.value);
            }

            loadText() {
                // Hide editor until text is loaded to prevent flickering
                const editor = this.editor;
                editor.style.visibility = 'hidden';
                editor.value = localStorage.getItem(SHIRO_SAVED_TEXT) || '';
                requestAnimationFrame(() => {
                    this.loadCursorPosition();
                    editor.style.visibility = 'visible';
                    this.updateCount();
                    // Disable fade transitions until text is loaded to prevent flickering
                    this.fadeTop.style.transition = 'none';
                    this.fadeBottom.style.transition = 'none';
                    this.updateFade();
                    requestAnimationFrame(() => {
                        this.fadeTop.style.transition = '';
                        this.fadeBottom.style.transition = '';
                    });
                });
            }

            saveCursorPosition() {
                localStorage.setItem(SHIRO_CURSOR_POSITION, this.editor.selectionStart);
            }

            loadCursorPosition() {
                const saved = localStorage.getItem(SHIRO_CURSOR_POSITION);
                if (saved) {
                    const position = parseInt(saved, 10);
                    const editor = this.editor;
                    requestAnimationFrame(() => {
                        editor.setSelectionRange(position, position);
                        editor.focus({ preventScroll: true });

                        // Fix scroll jumping when cursor is on the first line
                        const lineNumber = editor.value.substring(0, position).split('\n').length - 1;
                        if (lineNumber === 0) editor.scrollTop = 0;
                    });
                }
            }

            getWordsCount(content) {
                if (!content.trim()) return 0;

                if (this.segmenter && content.length < 300_000) {
                    let count = 0;
                    for (const segment of this.segmenter.segment(content)) {
                        if (segment.isWordLike) count++;
                    }
                    return count;
                }
                // Fallback for very old browsers or very large content
                return content.trim().split(/\s+/).filter(Boolean).length;
            }

            getReadingTime(wordCount) {
                // Average reading speed: 200 words per minute
                const wordsPerMinute = 200;
                const minutes = Math.ceil(wordCount / wordsPerMinute);

                if (minutes === 0) {
                    return '<1 minute';
                } else if (minutes < 60) {
                    return `~${minutes} minute${minutes !== 1 ? 's' : ''}`;
                } else if (minutes < 1440) {
                    const hours = Math.ceil(minutes / 60);
                    return `~${hours} hour${hours !== 1 ? 's' : ''}`;
                } else {
                    const days = Math.ceil(minutes / 1440);
                    return `~${days} day${days !== 1 ? 's' : ''}`;
                }
            }

            updateCount() {
                const text = this.editor.value;
                const wordCount = this.getWordsCount(text);
                let displayText;

                if (this.countMode === 'words') {
                    displayText = `${wordCount} word${wordCount !== 1 ? 's' : ''}`;
                } else {
                    displayText = this.getReadingTime(wordCount);
                }

                this.countDisplay.textContent = displayText;
            }

            toggleCountMode() {
                this.countDisplay.style.opacity = '0';
                setTimeout(() => {
                    this.countMode = this.countMode === 'words' ? 'reading' : 'words';
                    localStorage.setItem(SHIRO_COUNT_MODE, this.countMode);
                    this.updateCount();
                    this.countDisplay.style.opacity = '1';
                }, 150);
            }

            hide() {
                if (this.visible) {
                    this.controls.forEach(c => c.classList.add('hidden'));
                    this.visible = false;
                }
            }

            show() {
                if (!this.visible) {
                    this.updateCount();
                    this.controls.forEach(c => c.classList.remove('hidden'));
                    this.visible = true;
                }
            }

            setTheme(theme = this.theme, { transition = true } = {}) {
                const button = document.querySelector('[data-action="theme"]');
                const apply = () => {
                    document.documentElement.setAttribute('data-theme', theme);
                    button.textContent = theme === 'dark' ? 'Light' : 'Dark';
                    this.themeColor.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
                    this.theme = theme;
                };

                if (transition) {
                    button.style.opacity = '0';
                    setTimeout(() => {
                        apply();
                        button.style.opacity = '1';
                    }, 150);
                } else {
                    apply();
                }
            }

            updateFade() {
                const { scrollTop, scrollHeight, clientHeight } = this.editor;
                this.fadeTop.style.opacity = scrollTop > 0 ? '1' : '0';
                this.fadeBottom.style.opacity = Math.ceil(scrollTop + clientHeight) < scrollHeight ? '1' : '0';
            }

            // Actions
            openFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = TEXT_FILES.join(',');
                input.onchange = (event) => this.loadFile(event.target.files[0]);
                input.click();
                input.remove();
            }

            loadFile(file) {
                if (!file) return;
                if (this.editor.value.trim() && !confirm('Are you sure you want to clear all text and load the selected file?')) {
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => this.replaceText(reader.result);
                reader.readAsText(file);
            }

            // Replace all text in one step, so it can be undone
            replaceText(text) {
                this.editor.focus();
                this.editor.select();
                document.execCommand('insertText', false, text);
                this.show();
            }

            download() {
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const timestamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_at_${pad(now.getHours())}-${pad(now.getMinutes())}`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([this.editor.value], { type: 'text/plain' }));
                a.download = `shiro_notes_on_${timestamp}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            clearWithConfirmation() {
                if (this.editor.value.trim() && !confirm('Are you sure you want to clear all text?')) return;
                this.clear();
            }

            clear() {
                this.editor.style.opacity = '0';
                setTimeout(() => {
                    this.replaceText('');
                    this.editor.style.opacity = '1';
                }, 300);
            }

            fullscreen() {
                document.fullscreenElement
                    ? document.exitFullscreen?.()
                    : document.documentElement.requestFullscreen?.();
            }

            toggleTheme() {
                const newTheme = this.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem(SHIRO_THEME, newTheme);
                this.setTheme(newTheme);
            }

            handleSmartEnter(e) {
                // Shift+Enter: inserts a plain newline, breaking out of lists
                if (e.shiftKey) return;

                const { value, selectionStart, selectionEnd } = this.editor;
                const beforeCursor = value.substring(0, selectionStart);
                const lineStart = beforeCursor.lastIndexOf('\n') + 1;
                const lineEnd = value.indexOf('\n', selectionEnd);
                const currentLine = beforeCursor.substring(lineStart);
                const afterCursor = value.substring(selectionEnd, lineEnd === -1 ? value.length : lineEnd);

                const match = currentLine.match(LIST_ITEM);
                if (!match) return;

                e.preventDefault();
                const [, indent, marker, content] = match;

                // Empty item: outdent one level, or leave the list when already at the top
                if (!content.trim() && !afterCursor.trim()) {
                    const outdented = indent.replace(/^\t/, '');
                    this.editor.setSelectionRange(lineStart, selectionStart);
                    if (outdented === indent) {
                        document.execCommand('delete');
                    } else {
                        document.execCommand('insertText', false, `${outdented}${marker} `);
                    }
                    return;
                }

                // Continue the list with the next marker
                const nextMarker = marker.endsWith('.') ? `${parseInt(marker, 10) + 1}.` : marker;
                document.execCommand('insertText', false, `\n${indent}${nextMarker} `);
            }

            handleSmartBackspace(e) {
                const { value, selectionStart, selectionEnd } = this.editor;

                // Only handle if nothing is selected
                if (selectionStart !== selectionEnd) return;

                const beforeCursor = value.substring(0, selectionStart);
                const lastNewline = beforeCursor.lastIndexOf('\n');
                const currentLine = beforeCursor.substring(lastNewline + 1);

                // Empty item: only a marker with its trailing space, nothing typed yet
                const match = currentLine.match(LIST_ITEM);
                if (!match || match[3].trim()) return;

                e.preventDefault();
                // Remove the list marker
                const lineStart = lastNewline + 1;
                this.editor.setSelectionRange(lineStart, selectionStart);
                document.execCommand('delete');
            }

            handleSmartTab(e) {
                const { value, selectionStart, selectionEnd } = this.editor;
                const lineStart = value.lastIndexOf('\n', selectionStart - 1) + 1;

                // Multi-line selection: indent/dedent every line that is selected
                if (selectionStart !== selectionEnd) {
                    e.preventDefault();
                    const lineEnd = selectionEnd === value.length ? value.length : value.indexOf('\n', selectionEnd - 1);
                    const block = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);

                    const updated = block.split('\n').map(line => {
                        if (e.shiftKey) return line.replace(/^\t/, '');
                        return '\t' + line;
                    }).join('\n');

                    this.editor.setSelectionRange(lineStart, lineEnd === -1 ? value.length : lineEnd);
                    document.execCommand('insertText', false, updated);
                    this.editor.setSelectionRange(lineStart, lineStart + updated.length);
                    return;
                }

                const lineEnd = value.indexOf('\n', selectionStart);
                const line = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);
                const isList = LIST_ITEM.test(line);

                e.preventDefault();
                // Plain text: insert tab or no-op on shift
                if (!isList) {
                    if (!e.shiftKey) document.execCommand('insertText', false, '\t');
                    return;
                }

                // Indent/dedent list items
                if (e.shiftKey) {
                    const outdented = line.replace(/^\t/, '');
                    if (outdented === line) return;
                    this.editor.setSelectionRange(lineStart, lineStart + line.length);
                    document.execCommand('insertText', false, outdented);
                    const caret = Math.max(lineStart, selectionStart - 1);
                    this.editor.setSelectionRange(caret, caret);
                } else {
                    this.editor.setSelectionRange(lineStart, lineStart);
                    document.execCommand('insertText', false, '\t');
                    this.editor.setSelectionRange(selectionStart + 1, selectionStart + 1);
                }
            }

            about() {
                window.open('https://github.com/vsakkas/shiro', '_blank', 'noopener');
            }
        }

        // Start Shiro
        new Shiro();
    </script>
</body>
</html>
